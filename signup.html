<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | Tripify</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <style>
        /* Adjust navbar font size and spacing */
        .navbar-nav .nav-link {
            font-size: 14px; /* Reduce font size */
            margin-right: 10px; /* Reduce space between links */
        }

        .navbar-nav .nav-link:last-child {
            margin-right: 0; /* Remove margin from the last link */
        }

        /* Optional: Adjust the padding of the navbar */
        .navbar {
            padding: 0.5rem 1rem; /* Adjust the navbar padding if needed */
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Custom Navbar - Fixed navbar -->
<!-- ✅ Fixed Responsive Bootstrap Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <!-- Brand -->
    <a class="navbar-brand fw-bold text-warning" href="#">Tripify</a>

    <!-- ✅ Burger Button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- ✅ Collapsible Menu -->
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li>
      </ul>
    </div>
  </div>
</nav>

  <!-- Main Content -->
  <main class="main-content container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 p-4">
          <div class="card-body">
            <h1 class="text-center mb-4 fw-bold">Create Your Account</h1>

            <form id="signupForm" class="contact-form">

              <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" id="firstName" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" id="lastName" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="birthDate" class="form-label">Date of Birth</label>
                <input type="date" id="birthDate" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required>
              </div>

              <button type="submit" class="btn btn-warning w-100 fw-bold">Sign Up</button>
            </form>

            <p class="toggle-text text-center mt-3">
              Already have an account?
              <a href="login.html" class="text-decoration-none fw-semibold">Log In</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer bg-dark text-light py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1">&copy; 2025 Travel Agency | All Rights Reserved</p>
      <p class="mb-2">Team Members: Zhannur, Symbat, Ayazhan, Gulnaz.</p>
      <div class="socials">
        <a href="#" class="text-light mx-2 fs-5">🌐</a>
        <a href="#" class="text-light mx-2 fs-5">📷</a>
        <a href="#" class="text-light mx-2 fs-5">✉️</a>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="script-auth.js"></script>
</body>
</html>
