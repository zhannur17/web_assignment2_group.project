<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | Tripify</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Navigation - ФИКСИРОВАННАЯ -->
<nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-warning" href="#">
        <i class="fas fa-plane me-2"></i>Tripify
      </a>
      <!-- БУРГЕР МЕНЮ - ВСЕГДА ВИДИМ -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" 
              aria-controls="navbarContent" aria-expanded="false" aria-label="sToggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse text-end" id="navbarContent">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
          <li clas="nav-item"><a class="nav-link text-white" href="login.html">Log in</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 p-4">
          <div class="card-body">
            <h1 class="text-center mb-4 fw-bold">Create Your Account</h1>

            <form id="signupForm" class="contact-form">

              <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" id="firstName" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" id="lastName" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="birthDate" class="form-label">Date of Birth</label>
                <input type="date" id="birthDate" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required>
              </div>

              <button type="submit" class="btn btn-warning w-100 fw-bold">Sign Up</button>
            </form>

            <p class="toggle-text text-center mt-3">
              Already have an account?
              <a href="login.html" class="text-decoration-none fw-semibold">Log In</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer bg-dark text-light py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1">&copy; 2025 Travel Agency | All Rights Reserved</p>
      <p class="mb-2">Team Members: Zhannur, Symbat, Ayazhan, Gulnaz.</p>
      <div class="socials">
        <a href="#" class="text-light mx-2 fs-5">🌐</a>
        <a href="#" class="text-light mx-2 fs-5">📷</a>
        <a href="#" class="text-light mx-2 fs-5">✉️</a>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="script-auth.js"></script>
</body>
</html>
